name: Check & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Jobs only read the repository; the deploy reaches the server with its own key
permissions:
  contents: read

# Never run two deploys at the same time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # same as the server (Ubuntu 24.04)
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Formatting
        run: ruff format --check .

      # Fails when requirements*.in were edited without recompiling the pinned files
      - name: Pinned requirements match requirements*.in
        run: |
          pip-compile --quiet --strip-extras --output-file=requirements.txt requirements.in
          pip-compile --quiet --strip-extras --output-file=requirements-dev.txt requirements-dev.in
          git diff --exit-code requirements.txt requirements-dev.txt

      # Only what the project pins: the runner's own pip isn't ours to fix
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply on a fresh DB
        run: python manage.py migrate --noinput
        env:
          SQLITE_PATH: /tmp/ci.sqlite3

      - name: Tests
        run: |
          coverage run manage.py test
          coverage report
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Static files build (production storage)
        run: python manage.py collectstatic --noinput -v0
        env:
          DEBUG: "False"
          STATIC_ROOT: /tmp/staticfiles

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      # Secrets go in through the environment: interpolated into the script, their contents would become code
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is restricted on the server (forced command): it can only run deploy/update.sh, which gets the
      # commit this run checked in SSH_ORIGINAL_COMMAND and deploys that one, not whatever main has by then
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "blog@$DEPLOY_HOST" "$GITHUB_SHA"

      # Pages live under /en/ and /es/; the bare domain sends visitors who ask for no language (like curl) to /en/
      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://nestorbracho.com/en/)
            location=$(curl -s -o /dev/null -w '%{redirect_url}' https://nestorbracho.com/)
            if [ "$code" = "200" ] && [ "$location" = "https://nestorbracho.com/en/" ]; then
              echo "Site is up"; exit 0
            fi
            echo "Got $code for /en/ and a redirect to '$location' for /, retrying..."; sleep 5
          done
          exit 1

# /etc/nginx/sites-available/blog (deploy/README.md, step 6)
# TLS uses a Cloudflare Origin Certificate (Cloudflare SSL mode: "Full (strict)").

# Only Cloudflare reaches the server (the VM's firewall), and it sends the visitor's address in CF-Connecting-IP.
# Trusting that header from Cloudflare's addresses makes $remote_addr the visitor's in the logs, in X-Forwarded-For
# and in the rate limit below. The ranges are https://www.cloudflare.com/ips-v4 and /ips-v6; when they change, update
# them here and in the firewall rule (deploy/README.md, "Rangos de Cloudflare").
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Sending the contact and newsletter forms: 5 a minute per visitor, after a first burst of 5. Other requests have an
# empty key, which nginx doesn't count. Django limits them too.
map "$request_method $uri" $form_sender {
    "~^POST /(en|es)/(contact|newsletter)/$" $binary_remote_addr;
    default "";
}
limit_req_zone $form_sender zone=forms:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name nestorbracho.com www.nestorbracho.com;
    return 301 https://nestorbracho.com$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) syntax; on >= 1.25 use `listen 443 ssl;` + `http2 on;`
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nestorbracho.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    return 301 https://nestorbracho.com$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) syntax; on >= 1.25 use `listen 443 ssl;` + `http2 on;`
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nestorbracho.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    client_max_body_size 10M;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    location /media/ {
        alias /srv/blog/media/;
        # One Cache-Control header (expires would add a second one): 30 days
        add_header Cache-Control "public, max-age=2592000";
        # Never execute or render uploaded files as HTML
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        limit_req zone=forms burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://unix:/run/blog/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

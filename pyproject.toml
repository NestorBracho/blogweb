[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", "static"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear: likely bugs and design problems
    "UP",      # pyupgrade: modern syntax for the target version
    "DJ",      # Django-specific checks
]

[tool.ruff.lint.per-file-ignores]
# Embeds a whole article as data; those long lines are content, not code
"blog/article_generation.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["blog", "config", "main", "usermanager"]

[tool.ruff.format]
quote-style = "single"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests.py", "manage.py", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

{% comment %}
    Shared by the footer and the sidebar. `prefix` is the BEM block of the list
    (footer__social or widget-social). Profiles come from OWNER_*_URL in settings.
{% endcomment %}
<ul class="{{ prefix }}__list list-reset">

    {% if owner.github_url %}
        <li class="{{ prefix }}__item">
            <a class="{{ prefix }}__link" href="{{ owner.github_url }}" target="_blank" rel="noopener"
               aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        </li>
    {% endif %}

    {% if owner.linkedin_url %}
        <li class="{{ prefix }}__item">
            <a class="{{ prefix }}__link" href="{{ owner.linkedin_url }}" target="_blank" rel="noopener"
               aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
        </li>
    {% endif %}

    <li class="{{ prefix }}__item">
        <a class="{{ prefix }}__link" href="{% url 'blog:feed' %}" aria-label="RSS"><i class="fa-solid fa-rss"></i></a>
    </li>

</ul>
